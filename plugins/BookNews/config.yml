version: '2.0'

check-update: false

Prefix: '&8[&b服务器告示&8]&f '

OpenBookDelaySecond: 5

OpenBookSoundEffect:
  enable: true
  sound-effect: ENTITY_PLAYER_LEVELUP

Open-Book-Onjoin:
  enable: true
  # true = 每次进服都弹书；false = 仅在管理员执行 /booknews clear 之后、玩家尚未读过时弹
  always: true

KeepBook: false

Message:
  No-Permission: '&c你没有权限查看服务器告示。'

Interactive-Word:
  '1':
    word: 下一页 ▶
    placeholder: gotopage2
    bold: true
    color: gold
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: CHANGE_PAGE
      value: '2'
    hoverevent:
      enable: true
      text: 翻到第 2 页
  '2':
    word: 下一页 ▶
    placeholder: gotopage3
    bold: true
    color: gold
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: CHANGE_PAGE
      value: '3'
    hoverevent:
      enable: true
      text: 翻到第 3 页
  '3':
    word: ◀ 返回首页
    placeholder: gobackfirstpage
    bold: true
    color: gold
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: CHANGE_PAGE
      value: '1'
    hoverevent:
      enable: true
      text: 回到第 1 页
  '4':
    word: 打开公共指南
    placeholder: opencompass
    bold: true
    color: aqua
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: RUN_COMMAND
      value: /dm open home
    hoverevent:
      enable: true
      text: 打开指南针菜单
  '5':
    word: 打开商店
    placeholder: openshop
    bold: true
    color: green
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: RUN_COMMAND
      value: /shop menu main
    hoverevent:
      enable: true
      text: 打开物品买卖商店

book:
  '1': |-
    &8发布：2026年09月05日 12:38:30
    &0&l流浪世界 · 服务器告示
    &8────────────
    &0你好，&l%player_name%&0！

    &0每次进服都会打开本书。
    &0本期：Axiom 钢笔轨迹
    &0确认生成后不再清空节点
    &0（需客户端配套 1.2.8）。

    &0随时可再读：
    &0· 指南针首页「服务器告示」
    &0· 指令 &b/news
    &0· 右键告示可看历史留档

    %booknews_gotopage2%
  '2': |-
    &0&l本期 · 钢笔轨迹保留
    &8────────────
    &0长路径超出视距导致生成
    &0失败时，按 Enter 确认后
    &0节点仍会留着，可直接重试。
    &0请更新配套客户端到 1.2.8，
    &0完全退出游戏后再进服。

    &0长路径请关掉「延伸至地面」
    &0或沿路分段生成；单包超过
    &050 万格会被拒绝。

    %booknews_gotopage3%
  '3': |-
    &0&l快捷入口
    &8────────────
    &0%booknews_opencompass%
    &0%booknews_openshop%

    &8────────────
    &7制作组 RYAN STUDIO
    &7Paper 26.2 · MCWWS

    %booknews_gobackfirstpage%
config_version: '2.0'
