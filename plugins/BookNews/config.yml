version: '2.0'

check-update: false

Prefix: '&8[&b服务器告示&8]&f '

OpenBookDelaySecond: 5

OpenBookSoundEffect:
  enable: true
  sound-effect: ENTITY_PLAYER_LEVELUP

Open-Book-Onjoin:
  enable: false
  # 进服弹书改由 MCWWS_NewsArchive 按玩家模式处理（默认仅有新告示时弹）
  always: false

KeepBook: false

Message:
  No-Permission: '&c你没有权限查看服务器告示。'

Interactive-Word:
  '1':
    word: 下一页 ▶
    placeholder: gotopage2
    bold: true
    color: gold
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: CHANGE_PAGE
      value: '2'
    hoverevent:
      enable: true
      text: 翻到第 2 页
  '2':
    word: 下一页 ▶
    placeholder: gotopage3
    bold: true
    color: gold
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: CHANGE_PAGE
      value: '3'
    hoverevent:
      enable: true
      text: 翻到第 3 页
  '3':
    word: ◀ 返回首页
    placeholder: gobackfirstpage
    bold: true
    color: gold
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: CHANGE_PAGE
      value: '1'
    hoverevent:
      enable: true
      text: 回到第 1 页
  '4':
    word: 打开公共指南
    placeholder: opencompass
    bold: true
    color: aqua
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: RUN_COMMAND
      value: /dm open home
    hoverevent:
      enable: true
      text: 打开指南针菜单
  '5':
    word: 打开商店
    placeholder: openshop
    bold: true
    color: green
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: RUN_COMMAND
      value: /shop menu main
    hoverevent:
      enable: true
      text: 打开物品买卖商店

book:
  '1': |-
    &8发布：2026年09月27日 23:36:40
    &0&l流浪世界 · 服务器告示
    &8────────────
    &0你好，&l%player_name%&0！

    &0本期：商店基准价已更新
    &0· 改用 26.3 物价指南
    &0· 多数原版物品买卖价有调整
    &0· 新上架朱砂、硫磺、金蒲公英
    &0· 以及 Bounce 唱片、硫磺立方桶
    &0· 详见第 2 页

    &0随时可再读：
    &0· 指南针首页「服务器告示」
    &0· 指令 &b/news
    &0· 右键告示可看历史留档

    %booknews_gotopage2%
  '2': |-
    &0&l本期 · 商店物价
    &8────────────
    &0基准价来自 26.3 物价指南，
    &0出售仍约为买入的 99%。
    &0考古、木材和动态库存的
    &0加减规则没有变。

    &0杨树、坐垫、羊毛楼梯等
    &026.3 才有的方块还没进商店。

    &0店内、网页、改造扣费
    &0用的是同一套价。

    %booknews_gotopage3%
  '3': |-
    &0&l快捷入口
    &8────────────
    &0%booknews_opencompass%
    &0%booknews_openshop%

    &8────────────
    &7制作组 RYAN STUDIO
    &7Paper 26.2 · MCWWS

    %booknews_gobackfirstpage%
config_version: '2.0'
