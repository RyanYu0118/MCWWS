version: '2.0'

check-update: false

Prefix: '&8[&b服务器告示&8]&f '

OpenBookDelaySecond: 5

OpenBookSoundEffect:
  enable: true
  sound-effect: ENTITY_PLAYER_LEVELUP

Open-Book-Onjoin:
  enable: true
  # true = 每次进服都弹书；false = 仅在管理员执行 /booknews clear 之后、玩家尚未读过时弹
  always: true

KeepBook: false

Message:
  No-Permission: '&c你没有权限查看服务器告示。'

Interactive-Word:
  '1':
    word: 下一页 ▶
    placeholder: gotopage2
    bold: true
    color: gold
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: CHANGE_PAGE
      value: '2'
    hoverevent:
      enable: true
      text: 翻到第 2 页
  '2':
    word: 下一页 ▶
    placeholder: gotopage3
    bold: true
    color: gold
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: CHANGE_PAGE
      value: '3'
    hoverevent:
      enable: true
      text: 翻到第 3 页
  '3':
    word: ◀ 返回首页
    placeholder: gobackfirstpage
    bold: true
    color: gold
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: CHANGE_PAGE
      value: '1'
    hoverevent:
      enable: true
      text: 回到第 1 页
  '4':
    word: 打开公共指南
    placeholder: opencompass
    bold: true
    color: aqua
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: RUN_COMMAND
      value: /compass
    hoverevent:
      enable: true
      text: 打开指南针菜单
  '5':
    word: 打开商店
    placeholder: openshop
    bold: true
    color: green
    italic: false
    underlined: false
    obfuscated: false
    clickevent:
      enable: true
      action: RUN_COMMAND
      value: /shop menu main
    hoverevent:
      enable: true
      text: 打开物品买卖商店

book:
  '1': |-
    &8发布：2026年08月29日 17:12:08
    &0&l流浪世界 · 服务器告示
    &8────────────────
    &0你好，&l%player_name%&0！

    &0每次进服都会打开本书。
    &0新功能、修复与重要通知
    &0写在下一页。

    &0随时可再读：
    &0· 指南针首页「服务器告示」
    &0· 指令 &b/news

    %booknews_gotopage2%
  '2': |-
    &0&l本期 · 网页地图与界面
    &8────────────────
    &a✔ &0外网地图已修复

    &0地址：&bmcs.ryanstudio.work

    &0· &bmap.html&0 可正常加载
    &0  BlueMap（&bmcsmap&0 域名）
    &0· 商店标记 / GIS 与登录
    &0  走同一网页账号
    &0· 网页圆角统一为 &b8px&0，
    &0  视觉更利落

    &6◆ &0手机 App 底部导航：
    &0商店 / 地图 / 管理 / 我的
    &0首页可下 &bMCWWS-1.1.1.apk

    %booknews_gotopage3%
  '3': |-
    &0&l快捷入口
    &8────────────────
    &0%booknews_opencompass%
    &0%booknews_openshop%

    &8────────────────
    &7制作组 RYAN STUDIO
    &7Paper 26.2 · MCWWS

    %booknews_gobackfirstpage%
config_version: '2.0'
