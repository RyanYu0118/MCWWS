  insufficient-balance: "余额不足，需要 §e{total}§f（§7{blocks} 格§f：材料 §e{material}§f + 劳务 §e{labor}§f − 回收 §a{salvage}§f），当前 §c{balance}§f。"
  charged: "已扣除 §e{total}§f（§7{blocks} 格§f：材料 §e{material}§f + 劳务 §e{labor}§f − 回收 §a{salvage}§f）。"
  salvaged: "拆除回收 §a+{total}§f（§7{blocks} 格§f：回收 §a{salvage}§f − 材料 §e{material}§f − 劳务 §e{labor}§f），已卖给市场。"
