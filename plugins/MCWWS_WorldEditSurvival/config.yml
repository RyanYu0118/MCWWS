enabled: true
bypass-permission: mcwws.we.survival.bypass
prices-file: plugins/Skript/scripts/web/mcwws/economy/web_prices.yml
prices-reload-seconds: 60
# 创世神变更写入动态市场虚拟库存（拆除旧方块=供给/库存↑，放置新方块=需求/库存↓）
record-market-stock: true
market-trade-queue: plugins/Skript/scripts/web/data/market_trade_queue.txt
reverse-market-on-undo: true
reload-prices-before-estimate: true
# 劳务费：按拆除/放置格数计价，与方块市价无关
# 放置 0.5 / 格，拆除 = 放置 × 2（即 1.0 / 格）
labor:
  place-unit: 0.5
  demolish-multiplier: 2.0

# 拆除回收：拆下来的方块按市场卖价 × rate 折现给玩家，同时按 sell 侧写进市场库存队列。
# rate 1.0 = 完全按市场卖价卖出，和玩家自己挂市场一致；一次指令的净额 = 材料 + 劳务 − 回收，
# 净额为负时直接把差额打给玩家。
salvage:
  rate: 1.0

# 搬运对冲：同一条指令里「这里拆掉、那里放下」的同种方块判定为搬运，只收劳务费，
# 既不扣材料费也不给回收款，也不写市场库存队列（不在市场上转一圈）。
move-netting:
  enabled: true
max-scan-blocks: 500000
edit-authorization:
  enabled: true
undo-refund:
  enabled: true
  fee-rate: 0.05
charge-commands:
  - set
  - replace
  - stack
  - replacenear
  - walls
  - overlay
  - lay
  - faces
  - hollow
  - center
  - line
  - curve
  - move
  - fall
  - naturalize
  - forest
  - flora
  - cut
  - paste
  - place
  - cyl
  - hcyl
  - sphere
  - hsphere
  - pyramid
  - hpyramid
  - cone
  - removenear
  - removeabove
  - removebelow
  - drain
  - extinguish
  - snow
  - thaw
  - green
  - fixlava
  - fixwater
