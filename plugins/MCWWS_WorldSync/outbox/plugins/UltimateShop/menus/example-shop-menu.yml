title: '{shop-name}'
size: 54

open-actions:
  1:
    type: sound
    sound: item.book.page_turn

layout:
  - 'fs043500x'
  - 'ABCDEFGHI'
  - 'JKLMNOPQR'
  - 'STUVWXYZa'
  - 'bcdeghijk'
  - 'lmnopqrtu'

buttons:
  0:
    display-item:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
      custom-model-data: 2200002
      hide-tool-tip: true
  4:
    display-item:
      material: BLACK_STAINED_GLASS_PANE
      name: '{lang:previous-page-button}'
      custom-model-data: 2200008
  3:
    display-item:
      material: ENCHANTED_BOOK
      name: '{lang:back-button}'
      custom-model-data: 2200003
      glow: false
    actions:
      1:
        type: open_menu
        menu: main
  5:
    display-item:
      material: BLACK_STAINED_GLASS_PANE
      name: '{lang:next-page-button}'
      custom-model-data: 2200010
  f:
    display-item:
      material: NAME_TAG
      name: '{lang:favourite-menu-button-name}'
      lore:
        - '{lang:favourite-menu-button-line-1}'
        - '{lang:favourite-menu-button-line-2}'
    actions:
      1:
        type: open_menu
        menu: favourite
  s:
    display-item:
      material: NAME_TAG
      name: '{lang:search-menu-button-name}'
      lore:
        - '{lang:search-menu-button-line-1}'
        - '{lang:search-menu-button-line-2}'
      custom-model-data: 2200005
    actions:
      1:
        type: open_menu
        menu: search
  x:
    display-item:
      material: BARRIER
      name: '{lang:close-button}'
    actions:
      1:
        type: close
