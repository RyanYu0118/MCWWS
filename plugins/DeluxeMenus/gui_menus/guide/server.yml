    material: BOOK
    enchantments:
      - ARROW_DAMAGE;1
    item_flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
    slot: 10
    priority: 1
    update: true
    display_name: '&e重载 Skript（全部）'
    lore:
      - ''
      - '&f执行：&a/sk reload all'
      - '&7以你的身份执行，聊天栏可见日志'
      - '&7重载后会自动恢复本界面'
      - ''
      - '&a左键 &7执行'
    left_click_commands:
      - '[console] lp user %player_name% permission settemp skript.admin true 30s'
      - '[console] mcwws_queue_reopen_server %player_name%'
      - '[close]'
      - '[player] sk reload all<delay=2>'
      - '[sound] ENTITY_EXPERIENCE_ORB_PICKUP'
