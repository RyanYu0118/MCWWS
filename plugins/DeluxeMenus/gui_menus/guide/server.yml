menu_title: '&c&l服务器管理'
update_interval: 1
open_command: []
size: 54
open_requirement:
  requirements:
    admin:
      type: javascript
      expression: "'%player_name%' == 'Ryan_yu__' || '%player_is_op%' == 'yes'"
  deny_commands:
    - '[message] &c你没有权限打开服务器管理。'
    - '[sound] ENTITY_ENDERMAN_TELEPORT 1 0.1'
