menu_title: '&c&l服务器管理'
update_interval: 1
open_command: []
size: 27
open_requirement:
  minimum_requirements: 1
  requirements:
    is_owner:
      type: string equals
      input: '%player_name%'
      output: 'Ryan_yu__'
    is_op:
      type: string equals
      input: '%player_is_op%'
      output: 'yes'
  deny_commands:
