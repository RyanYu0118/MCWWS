      - '&cShift+左键 &7确认执行'
    shift_left_click_commands:
      - '[console] lp user %player_name% permission settemp customcrafting.cmd.reload true 30s'
      - '[console] lp user %player_name% permission settemp customcrafting.cmd.* true 30s'
      - '[console] mcwws_queue_reopen_server %player_name%'
      - '[close]'
      - '[player] cc reload<delay=2>'
      - '[sound] ENTITY_EXPERIENCE_ORB_PICKUP'
  'reload_shop':
