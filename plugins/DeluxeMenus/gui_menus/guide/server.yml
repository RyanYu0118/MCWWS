menu_title: '&c&l服务器管理'
update_interval: 1
open_command: []
size: 27
open_requirement:
  requirements:
    admin:
      type: javascript
      expression: "'%player_name%' == 'Ryan_yu__' || '%player_is_op%' == 'yes'"
  deny_commands:
    - '[message] &c你没有权限打开服务器管理。'
    - '[sound] ENTITY_ENDERMAN_TELEPORT 1 0.1'
open_commands:
  - '[sound] BLOCK_BEACON_ACTIVATE'
items:
  'reload_skript':
    material: BOOK
    enchantments:
      - ARROW_DAMAGE;1
    hide_enchantments: true
    slot: 10
    priority: 1
    update: true
    hide_attributes: true
    display_name: '&e重载 Skript'
    lore:
      - ''
      - '&f执行：&a/sk reload all'
      - '&7以你的身份执行，聊天栏可见日志'
      - '&7重载后会自动恢复本界面'
      - ''
      - '&cShift+左键 &7确认执行'
    shift_left_click_commands:
      - '[console] lp user %player_name% permission settemp skript.admin true 30s'
      - '[console] mcwws_queue_reopen_server %player_name%'
      - '[close]'
      - '[player] sk reload all<delay=2>'
      - '[sound] ENTITY_EXPERIENCE_ORB_PICKUP'
  'reload_cc':
    material: CRAFTING_TABLE
    enchantments:
      - ARROW_DAMAGE;1
    hide_enchantments: true
    slot: 12
    priority: 1
    update: true
