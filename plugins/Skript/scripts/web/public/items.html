<!-- DS-WEB-VERSION: 2.5.9 -->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://www.ryanstudio.work/upload/Icon.png">
    <title>物品目录 - 流浪世界服务器商店系统</title>
    <meta name="description" content="浏览所有商店物品及当前价格">
    <link rel="stylesheet" href="style.css?v=2.5.78">
    <script src="mcwws-theme.js?v=2"></script>
    <script src="mcwws-page-transition.js?v=1"></script>
    <link rel="stylesheet" href="themes.css?v=9">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon"></span>
            <span class="brand-text">流浪世界服务器商店系统</span>
        </div>
        <div class="nav-links">
            <a href="home.html" class="nav-link" title="返回流浪世界服务">
                <span class="nav-icon">🏠</span> 更多服务
            </a>
            <a href="index.html" class="nav-link">
                <span class="nav-icon">📊</span> 仪表板
            </a>
            <a href="items.html" class="nav-link active">
                <span class="nav-icon">🛒</span> 物品目录
            </a>
            <a href="build.html" class="nav-link">
                <span class="nav-icon">🏗️</span> 建造工具
            </a>
            </div>
        <div class="nav-actions">
            <span class="item-count" id="itemCount">-- 个物品</span>
            <button id="refreshButton" class="refresh-btn" type="button" title="刷新物品"><span class="refresh-icon">⟳</span></button>
            <button type="button" id="cartToggleBtn" class="cart-nav-btn" title="购物车" aria-label="打开购物车">
                <svg class="cart-nav-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2zM7.16 14h9.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 21.04 5H6.21L5.27 3H2v2h2l3.6 7.59-1.35 2.44C5.52 15.37 6.48 17 8 17h12v-2H8.42l1.74-1z"/>
                </svg>
                <span id="cartBadge" class="cart-nav-badge" hidden>0</span>
            </button>
            <div class="user-actions">
                <div class="mcwws-auth-widget" id="mcwwsAuthWidget">
                    <button type="button" id="authButton" class="mcwws-auth-avatar-btn" aria-label="账户" aria-expanded="false" aria-haspopup="true">
                        <img id="authAvatar" class="mcwws-auth-avatar-img" width="36" height="36" alt="" decoding="async" referrerpolicy="no-referrer">
                        <span class="mcwws-auth-avatar-fallback" aria-hidden="true">👤</span>
                    </button>
                    <div id="authPopover" class="mcwws-auth-popover" role="tooltip" aria-hidden="true">
                        <div class="mcwws-auth-popover-body">
                            <p id="authPopoverTitle" class="mcwws-auth-popover-title">未登录</p>
                            <p id="authPopoverMeta" class="mcwws-auth-popover-meta"></p>
                            <button type="button" id="authPopoverAction" class="mcwws-auth-popover-action">登录 / 注册</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 英雄区 -->
    <header class="hero items-hero dashboard-hero">
        <div class="hero-inner">
            <div class="hero-content">
                <h1 class="hero-title">物品目录</h1>
                <p class="hero-subtitle">浏览所有商店物品及当前价格</p>
                <div class="search-container">
                    <input type="text" id="searchInput" class="hero-search" placeholder="搜索物品..." autocomplete="off">
                    <button type="button" id="searchClearBtn" class="search-clear-btn" aria-label="清除搜索" hidden>×</button>
                </div>
            </div>
            <aside class="hero-clock-widget" id="heroCompassWidget" aria-label="游戏指南针与方位">
                <div class="hero-clock-panel glass">
                    <div id="heroCompassIconMount" class="hero-clock-icon"></div>
                    <div class="hero-clock-meta">
                        <span class="hero-clock-label">指南针</span>
                        <span class="hero-clock-time" data-pointer-bearing-desc data-pointer-bearing-title>移动鼠标查看方位</span>
                    </div>
                </div>
            </aside>
        </div>
        <div class="hero-glow"></div>
    </header>

    <div class="container">
        <!-- 分类选项卡 -->
        <section class="category-section glass">
            <div class="category-tabs" id="categoryTabs">
                <button class="category-btn active" data-scope="all">全部</button>
                <button class="category-btn" data-scope="in_shop">商店内</button>
                <!-- UltimateShop 分类由 items.js 动态注入 -->
            </div>
        </section>

        <!-- 物品网格 -->
        <section class="items-section">
            <div class="items-header">
                <span class="items-showing" id="itemsShowing">显示 -- 个物品</span>
                <div class="filter-options">
                    <label class="filter-checkbox">
                        <input type="checkbox" id="hideUntradable">
                        <span class="checkmark"></span>
                        隐藏不可交易物品
                    </label>
                    <select id="sortSelect" class="filter-select">
                        <option value="name">按名称排序</option>
                        <option value="buyPrice">按购买价排序</option>
                        <option value="sellPrice">按出售价排序</option>
                        <option value="stock">按库存排序</option>
                    </select>
                    <!-- 新增逆序复选框 -->
                    <label class="filter-checkbox" style="margin-left: 10px;">
                        <input type="checkbox" id="sortReverse">
                        <span class="checkmark"></span>
                        逆序
                    </label>
                </div>
                <div class="page-controls items-pagination">
                    <button id="pageFirst" class="pagination-btn" type="button">首页</button>
                    <button id="pagePrev" class="pagination-btn" type="button">上一页</button>
                    <span id="pageInfo" class="pagination-info">第 1 / 1 页</span>
                    <div class="page-jump">
                        <input type="number" id="pageJumpInput" class="page-jump-input" placeholder="页码" min="1">
                        <button id="pageJumpBtn" class="pagination-btn page-jump-btn" type="button">跳转</button>
                    </div>
                    <button id="pageNext" class="pagination-btn" type="button">下一页</button>
                    <button id="pageLast" class="pagination-btn" type="button">尾页</button>
                </div>
                <div id="letterIndexBar" class="letter-index-bar" role="toolbar" aria-label="按首字母筛选"></div>
            </div>

            <div class="items-grid" id="itemsGrid">
                <div class="loading-spinner"></div>
            </div>
            <div class="page-controls items-pagination items-pagination--bottom" aria-label="分页（页尾）">
                <button id="pageFirstBottom" class="pagination-btn" type="button">首页</button>
                <button id="pagePrevBottom" class="pagination-btn" type="button">上一页</button>
                <span id="pageInfoBottom" class="pagination-info">第 1 / 1 页</span>
                <div class="page-jump">
                    <input type="number" id="pageJumpInputBottom" class="page-jump-input" placeholder="页码" min="1">
                    <button id="pageJumpBtnBottom" class="pagination-btn page-jump-btn" type="button">跳转</button>
                </div>
                <button id="pageNextBottom" class="pagination-btn" type="button">下一页</button>
                <button id="pageLastBottom" class="pagination-btn" type="button">尾页</button>
            </div>
        </section>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>流浪世界服务器商店系统 v2.0 - 由 RYAN STUDIO 制作 - <a href="https://www.ryanstudio.work" target="_blank">流浪世界服务器</a>
        </p>
    </footer>

    <!-- 物品详情模态框 -->
    <div id="itemModal" class="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2 id="modalItemName">物品详情</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div id="modalBody" class="modal-body">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </div>

    <div id="tradeModal" class="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2 id="tradeModalTitle">选择上架位置</h2>
                <button type="button" class="modal-close" onclick="closeTradeModal()">×</button>
            </div>
            <div id="tradeModalBody" class="modal-body"></div>
        </div>
    </div>

    <div id="cartBackdrop" class="cart-backdrop" hidden aria-hidden="true"></div>
    <aside id="cartDrawer" class="cart-drawer" aria-label="购物车" aria-hidden="true">
        <div class="cart-drawer-header">
            <h2 class="cart-drawer-title">购物车</h2>
            <button type="button" id="cartCloseBtn" class="cart-drawer-close" aria-label="关闭购物车">×</button>
        </div>
        <div id="cartDrawerBody" class="cart-drawer-body"></div>
        <div class="cart-drawer-footer">
            <div class="cart-drawer-total-row">
                <span>合计（系统买入价）</span>
                <strong id="cartTotalPrice">￥0.00</strong>
            </div>
            <p class="cart-drawer-hint" id="cartDrawerHint">登录后可提交订单；扣款与发放在你上线时由 UltimateShop 自动完成。</p>
            <div id="cartPendingOrders" class="cart-pending-orders" hidden></div>
            <div class="cart-drawer-actions">
                <button type="button" id="cartClearBtn" class="cart-drawer-btn cart-drawer-btn--ghost">清空</button>
                <button type="button" id="cartCheckoutBtn" class="cart-drawer-btn cart-drawer-btn--primary">提交订单</button>
                <button type="button" id="cartMapBtn" class="cart-drawer-btn cart-drawer-btn--ghost">在地图上查看</button>
            </div>
        </div>
    </aside>

    <div id="authModal" class="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2 id="authModalTitle">登录</h2>
                <button type="button" class="modal-close" aria-label="关闭">×</button>
            </div>
            <div class="modal-body">
                <div class="auth-toggle">
                    <button id="authModeLogin" type="button" class="auth-toggle-btn active">登录</button>
                    <button id="authModeRegister" type="button" class="auth-toggle-btn">注册</button>
                </div>
                <form id="authForm">
                    <div class="form-field">
                        <label for="authUsername">用户名</label>
                        <input type="text" id="authUsername" autocomplete="username" required>
                    </div>
                    <div class="form-field">
                        <label for="authPassword">密码</label>
                        <input type="password" id="authPassword" autocomplete="current-password" required>
                    </div>
                    <div class="form-field auth-register-only" style="display:none;">
                        <label for="authPlayerId">游戏玩家ID</label>
                        <input type="text" id="authPlayerId" autocomplete="off">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">提交</button>
                    </div>
                    <p id="authMessage" class="auth-message"></p>
                </form>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three.module.min.js?v=2"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        window.THREE = THREE;
    </script>
    <script src="mcwws-auth.js?v=8"></script>
    <script src="lang.js?v=2.5.9" defer></script>
    <script src="texture-mapper.js?v=2.5.76" defer></script>
    <script src="enchant-glint.js?v=2.5.28" defer></script>
    <script src="texture-animation.js?v=2.5.65" defer></script>
    <script src="item-model-renderer.js?v=2.5.72" defer></script>
    <script src="price-history-chart.js?v=7"></script>
    <script src="items.js?v=2.5.75" defer></script>
</body>

</html>
