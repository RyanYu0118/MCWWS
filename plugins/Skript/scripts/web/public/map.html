<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://www.ryanstudio.work/upload/Icon.png">
    <title>地图系统 - 流浪世界服务</title>
    <meta name="description" content="流浪世界服务器 BlueMap 地图 — GIS 标注、商店标记与交易搜索">
    <link rel="stylesheet" href="style.css?v=2.5.78">
    <script src="mcwws-theme.js?v=2"></script>
    <script src="mcwws-page-transition.js?v=1"></script>
    <link rel="stylesheet" href="themes.css?v=15">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="services-hub-page services-map-page">
    <main class="services-map-frame-wrap">
        <iframe
            id="bluemapFrame"
            class="services-map-frame"
            title="BlueMap 地图"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
        <div class="services-map-loading glass" id="mapLoading">正在加载地图…</div>
        <div class="services-map-auth-float" id="mapAuthFloat">
            <div class="mcwws-auth-widget services-map-auth-widget" id="mapAuthWidget">
                <button type="button" id="mapAuthButton" class="mcwws-auth-avatar-btn" aria-label="账户" aria-expanded="false" aria-haspopup="true">
                    <img id="mapAuthAvatar" class="mcwws-auth-avatar-img" width="36" height="36" alt="" decoding="async" referrerpolicy="no-referrer">
                    <span class="mcwws-auth-avatar-fallback" aria-hidden="true">👤</span>
                </button>
                <div id="mapAuthPopover" class="mcwws-auth-popover" role="tooltip" aria-hidden="true">
                    <div class="mcwws-auth-popover-body">
                        <p id="mapAuthPopoverTitle" class="mcwws-auth-popover-title">未登录</p>
                        <p id="mapAuthPopoverMeta" class="mcwws-auth-popover-meta"></p>
                        <a href="home.html" class="mcwws-auth-popover-services-link">🏠 更多服务</a>
                        <button type="button" id="mapAuthPopoverAction" class="mcwws-auth-popover-action">登录 / 注册</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="authModal" class="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2 id="authModalTitle">登录</h2>
                <button type="button" class="modal-close" aria-label="关闭">×</button>
            </div>
            <div class="modal-body">
                <div class="auth-toggle">
                    <button id="authModeLogin" type="button" class="auth-toggle-btn active">登录</button>
                    <button id="authModeRegister" type="button" class="auth-toggle-btn">注册</button>
                </div>
                <form id="authForm">
                    <div class="form-field">
                        <label for="authUsername">用户名</label>
                        <input type="text" id="authUsername" autocomplete="username" required>
                    </div>
                    <div class="form-field">
                        <label for="authPassword">密码</label>
                        <input type="password" id="authPassword" autocomplete="current-password" required>
                    </div>
                    <div class="form-field auth-register-only" style="display:none;">
                        <label for="authPlayerId">游戏玩家 ID</label>
                        <input type="text" id="authPlayerId" autocomplete="off">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">提交</button>
                    </div>
                    <p id="authMessage" class="auth-message"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="services-config.js?v=1"></script>
    <script src="mcwws-auth.js?v=9"></script>
    <script>
        (function () {
            const frame = document.getElementById('bluemapFrame');
            const loading = document.getElementById('mapLoading');

            function resolveBluemapBase() {
                return (window.MCWWS_SERVICES && window.MCWWS_SERVICES.bluemapUrl) || '/';
            }

            function buildBluemapFrameUrl() {
                let url;
                try {
                    url = new URL(resolveBluemapBase(), window.location.href);
                } catch {
                    url = new URL('/', window.location.href);
                }
                const pageParams = new URLSearchParams(window.location.search);
                pageParams.forEach((value, key) => {
                    url.searchParams.set(key, value);
                });
                if (window.location.hash) {
                    url.hash = window.location.hash;
                }
                return url.toString();
            }

            function syncAuthToFrame() {
                if (!frame?.contentWindow) return;
                const auth = window.MCWWS_AUTH;
                frame.contentWindow.postMessage({
                    type: 'mcwws-auth',
                    authToken: auth.getToken(),
                    user: auth.getUser()
                }, '*');
            }

            /** iframe 的 load 早于 mcwws-shops.js，需重试直到地图脚本就绪 */
            function syncAuthToFrameWithRetry(attemptsLeft = 16, intervalMs = 400) {
                syncAuthToFrame();
                if (attemptsLeft <= 1) return;
                window.setTimeout(
                    () => syncAuthToFrameWithRetry(attemptsLeft - 1, intervalMs),
                    intervalMs
                );
            }

            function mountMap() {
                const url = buildBluemapFrameUrl();
                if (!frame) return;
                if (frame.dataset.loaded !== '1') {
                    frame.dataset.loaded = '1';
                    frame.addEventListener('load', () => {
                        if (loading) loading.hidden = true;
                        syncAuthToFrameWithRetry();
                    });
                } else {
                    syncAuthToFrameWithRetry();
                }
                frame.src = url;
            }

            window.mcwwsGisVolumeDiag = function () {
                const fn = frame?.contentWindow?.mcwwsGisVolumeDiag;
                if (typeof fn === 'function') {
                    return fn();
                }
                return {
                    error: '地图 iframe 尚未就绪',
                    hint: '请等待地图加载完成，或在 DevTools Console 顶部的 iframe 上下文里运行'
                };
            };

            mountMap();
            window.addEventListener('mcwws-services-config', mountMap);
            window.setTimeout(mountMap, 500);

            window.MCWWS_AUTH.onChange(syncAuthToFrame);
            window.MCWWS_AUTH.init().then(() => syncAuthToFrameWithRetry(8, 300));

            window.addEventListener('message', (event) => {
                const data = event.data || {};
                if (data.type === 'mcwws-gis-ready') {
                    window.mcwwsGisVolumeDiag = function () {
                        const fn = frame?.contentWindow?.mcwwsGisVolumeDiag;
                        return typeof fn === 'function' ? fn() : { error: 'map iframe diag unavailable' };
                    };
                    return;
                }
                if (data.type === 'mcwws-map-clean') {
                    document.body.classList.toggle('services-map-clean', !!data.active);
                    return;
                }
                if (data.type === 'mcwws-auth-request') {
                    syncAuthToFrame();
                    return;
                }
                if (data.type === 'mcwws-auth-required') {
                    window.MCWWS_AUTH.openModal();
                }
            });
        })();
    </script>
</body>
</html>
