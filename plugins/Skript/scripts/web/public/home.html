<!doctype html>
<html lang="zh-CN" data-intensity="vivid">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1D2B26">
  <meta name="description" content="流浪世界服务器的商店、地图、管理与统一账户入口。">
  <title>流浪世界服务</title>
  <link rel="stylesheet" href="mcwws-auth.css?v=1">
  <link rel="stylesheet" href="services-home-glass.css?v=11">
  <link rel="stylesheet" href="services-workspace.css?v=13">
  <link rel="stylesheet" href="button-waterdrop.css?v=1">
  <script src="mcwws-auth.js?v=15" defer></script>
  <script type="module" src="services-home-glass.js?v=7"></script>
  <script type="module" src="services-workspace.js?v=19"></script>
  <script type="module" src="shop-toolbar-controls.js?v=1"></script>
  <script type="module" src="services-account.js?v=1"></script>
</head>
<body>
  <glass-scene class="alpine-scene">
  <div class="landscape" data-glass-backdrop aria-hidden="true"></div>
  <header class="top">
    <div class="top-inner glass" data-liquid>
      <a href="#scene" class="wordmark" data-service="home"><span class="mark" aria-hidden="true"></span><span data-workspace-brand>流浪世界</span></a>
      <span class="threshold">流浪世界服务</span>
      <div class="segmented glass" data-liquid role="group" aria-label="光感强度">
        <span class="dock-slider" aria-hidden="true" hidden></span>
        <button type="button" data-intensity="soft" aria-pressed="false">弱</button>
        <button type="button" data-intensity="balanced" aria-pressed="false">均衡</button>
        <button type="button" data-intensity="vivid" aria-pressed="true">强</button>
      </div>
      <nav class="segmented glass shop-workspace-nav" data-liquid aria-label="模块导航" hidden>
        <span class="dock-slider" aria-hidden="true" hidden></span>
        <a href="index.html" data-shop-view="dashboard">仪表盘</a>
        <a href="items.html" data-shop-view="catalog" aria-current="page">物品目录</a>
        <a href="manage/shop-locations.html" data-shop-view="manage" hidden>商店位置</a>
      </nav>
      <div class="shop-workspace-actions" aria-label="商店操作" hidden>
        <span data-shop-status aria-live="off"></span>
        <button type="button" data-shop-action="refresh" aria-label="刷新" title="刷新">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0-.9 6M20 4v6h-6"/></svg>
        </button>
        <button type="button" data-shop-action="cart" aria-label="购物车" title="购物车">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6"/><circle cx="9" cy="19" r="1.25"/><circle cx="17" cy="19" r="1.25"/></svg>
          <span data-shop-cart-count hidden></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="scene" aria-labelledby="hero-title">
      <div class="hero-inner">
        <p class="eyebrow"><span></span> MCWWS / SERVICES</p>
        <h1 id="hero-title">流浪世界服务</h1>
        <p class="lede">在雨夜灯火中，回到流浪世界。</p>
        <div class="hero-actions">
          <button type="button" class="glass primary" data-liquid id="open-panel"><span class="orbit" aria-hidden="true"></span>打开光感面板</button>
        </div>
      </div>
      <aside class="caption">
        <span class="caption-line" aria-hidden="true"></span>
        <div><strong>雨夜与灯火</strong><small>切换右上角档位，体验不同光感</small></div>
      </aside>
    </section>
    <section class="materials" aria-labelledby="materials-title">
      <div class="materials-inner">
        <p class="eyebrow"><span></span> WORLD SERVICES</p>
        <h2 id="materials-title">从这里进入流浪世界</h2>
        <p class="section-copy">底栏可直接点击，也可按住横滑，松手进入对应服务。</p>
        <p id="mcwwsPwaHint" class="section-copy">可将本站添加到手机主屏幕。</p>
      </div>
    </section>
  </main>

  <section class="service-workspace" aria-label="服务工作区" hidden>
    <div class="service-track">
      <iframe title="商店" data-service-src="items.html?embed=workspace-v8&glass=8" inert aria-hidden="true"></iframe>
      <iframe title="地图" data-service-src="map.html" inert aria-hidden="true"></iframe>
      <iframe title="管理" data-service-src="manage/shop-locations.html?embed=workspace-manage" inert aria-hidden="true"></iframe>
    </div>
  </section>

  <nav class="dock glass mcwws-auth-widget" id="mcwwsAuthWidget" aria-label="服务导航">
    <span class="dock-slider" aria-hidden="true" hidden></span>
    <a href="#scene" data-service="home" aria-current="page" draggable="false" aria-label="主页" title="主页">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 8-7 8 7v10h-6v-6h-4v6H4z"/></svg>
    </a>
    <a href="items.html" data-service="shop" draggable="false" aria-label="商店" title="商店"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14l1 13H4L5 7Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></a>
    <a href="map.html" data-service="map" draggable="false" aria-label="地图" title="地图"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2V5Z"/><path d="M9 3v16M15 5v16"/></svg></a>
    <a href="manage/shop-locations.html" data-service="manage" draggable="false" aria-label="管理" title="管理"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8m4 0h4M4 17h3m4 0h9"/><circle cx="14" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></a>
    <button type="button" id="authButton" class="mcwws-auth-avatar-btn" aria-label="账户" title="账户" aria-expanded="false" aria-haspopup="true">
      <img id="authAvatar" class="mcwws-auth-avatar-img" alt="" width="32" height="32" hidden decoding="async" referrerpolicy="no-referrer">
      <span class="mcwws-auth-avatar-fallback" aria-hidden="true"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-1a7 7 0 0 1 14 0v1"/></svg></span>
    </button>
    <div id="authPopover" class="mcwws-auth-popover" role="tooltip" aria-hidden="true">
      <div class="mcwws-auth-popover-body">
        <p id="authPopoverTitle" class="mcwws-auth-popover-title">未登录</p>
        <p id="authPopoverMeta" class="mcwws-auth-popover-meta"></p>
        <button type="button" id="authPopoverAction" class="mcwws-auth-popover-action">登录 / 注册</button>
      </div>
    </div>
  </nav>

  <div id="authModal" class="modal services-auth-modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle" tabindex="-1">
    <div class="modal-content glass">
      <div class="modal-header"><h2 id="authModalTitle">登录</h2><button type="button" class="modal-close" aria-label="关闭">×</button></div>
      <div class="modal-body">
        <div class="auth-toggle"><button id="authModeLogin" type="button" class="auth-toggle-btn active">登录</button><button id="authModeRegister" type="button" class="auth-toggle-btn">注册</button></div>
        <form id="authForm">
          <div class="form-field"><label for="authUsername">用户名</label><input type="text" id="authUsername" autocomplete="username" required></div>
          <div class="form-field"><label for="authPassword">密码</label><input type="password" id="authPassword" autocomplete="current-password" required></div>
          <div class="form-field auth-register-only" style="display:none"><label for="authPlayerId">游戏玩家ID</label><input type="text" id="authPlayerId" autocomplete="off"></div>
          <div class="form-actions"><button type="submit" class="primary-btn">提交</button></div>
          <p id="authMessage" class="auth-message" role="status"></p>
        </form>
      </div>
    </div>
  </div>

  <dialog class="glass panel" data-liquid id="light-panel" aria-labelledby="panel-title">
    <div class="handle" aria-hidden="true"></div>
    <form method="dialog"><button class="close" aria-label="关闭光感面板" autofocus>×</button></form>
    <p class="eyebrow"><span></span> ULTRA_THICK</p>
    <h2 id="panel-title">光感面板</h2>
    <p>这块半模态面板使用最厚的材质。切换光感强度，对比边缘高光和背景通透度。</p>
    <div class="segmented glass panel-options" data-liquid role="group" aria-label="光感强度">
      <span class="dock-slider" aria-hidden="true" hidden></span>
      <button type="button" data-intensity="soft" aria-pressed="false">弱</button>
      <button type="button" data-intensity="balanced" aria-pressed="false">均衡</button>
      <button type="button" data-intensity="vivid" aria-pressed="true">强</button>
    </div>
  </dialog>
  </glass-scene>
  <script src="services-config.js?v=1" defer></script>
</body>
</html>
