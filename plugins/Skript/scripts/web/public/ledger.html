<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <link rel="icon" type="image/png" href="https://www.ryanstudio.work/upload/Icon.png">
    <title>零钱明细 - 流浪世界服务器</title>
    <meta name="description" content="查看游戏内零钱收入与支出明细">
    <link rel="stylesheet" href="style.css?v=2.5.88">
    <script src="mcwws-theme.js?v=3"></script>
    <script src="mcwws-page-transition.js?v=3"></script>
    <link rel="stylesheet" href="themes.css?v=18">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="mcwws-ledger-page">
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon"></span>
            <span class="brand-text">零钱明细</span>
        </div>
        <div class="nav-links">
            <a href="home.html" class="nav-link" title="返回流浪世界服务">
                <span class="nav-icon">🏠</span> 更多服务
            </a>
            <a href="items.html" class="nav-link">
                <span class="nav-icon">🛒</span> 商店系统
            </a>
        </div>
        <div class="nav-actions">
            <div class="user-actions">
                <div class="mcwws-auth-widget" id="mcwwsAuthWidget">
                    <button type="button" id="authButton" class="mcwws-auth-avatar-btn" aria-label="账户" aria-expanded="false" aria-haspopup="true">
                        <img id="authAvatar" class="mcwws-auth-avatar-img" width="36" height="36" alt="" decoding="async" referrerpolicy="no-referrer">
                        <span class="mcwws-auth-avatar-fallback" aria-hidden="true">👤</span>
                    </button>
                    <div id="authPopover" class="mcwws-auth-popover" role="tooltip" aria-hidden="true">
                        <div class="mcwws-auth-popover-body">
                            <p id="authPopoverTitle" class="mcwws-auth-popover-title">未登录</p>
                            <p id="authPopoverMeta" class="mcwws-auth-popover-meta"></p>
                            <button type="button" id="authPopoverAction" class="mcwws-auth-popover-action">登录 / 注册</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main id="mcwwsLedgerPage" class="mcwws-ledger-page-main container">
        <header class="mcwws-ledger-page-head">
            <h1>零钱明细</h1>
            <p class="mcwws-ledger-page-sub">收入与支出记录；飞行费用可单独筛选查看</p>
        </header>

        <div id="mcwwsLedgerLoginGate" class="mcwws-ledger-page-gate glass" hidden>
            <p>登录后即可查看与你的游戏角色绑定的零钱明细。</p>
            <button type="button" id="mcwwsLedgerLoginBtn" class="primary-btn">登录 / 注册</button>
        </div>

        <div id="mcwwsLedgerPageCard" class="mcwws-ledger-page-card">
            <div class="mcwws-ledger-summary" id="mcwwsLedgerSummary"></div>
            <div class="mcwws-ledger-filters" id="mcwwsLedgerFilters">
                <button type="button" class="mcwws-ledger-filter is-active" data-filter="exclude_flight">不含飞行</button>
                <button type="button" class="mcwws-ledger-filter" data-filter="all">全部</button>
                <button type="button" class="mcwws-ledger-filter" data-filter="flight">仅飞行</button>
            </div>
            <div class="mcwws-ledger-table-wrap">
                <table class="mcwws-ledger-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>类型</th>
                            <th>说明</th>
                            <th>金额</th>
                            <th>余额</th>
                        </tr>
                    </thead>
                    <tbody id="mcwwsLedgerBody">
                        <tr><td colspan="5" class="mcwws-ledger-empty">加载中…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="authModal" class="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2 id="authModalTitle">登录</h2>
                <button type="button" class="modal-close" aria-label="关闭">×</button>
            </div>
            <div class="modal-body">
                <div class="auth-toggle">
                    <button id="authModeLogin" type="button" class="auth-toggle-btn active">登录</button>
                    <button id="authModeRegister" type="button" class="auth-toggle-btn">注册</button>
                </div>
                <form id="authForm">
                    <div class="form-field">
                        <label for="authUsername">用户名</label>
                        <input type="text" id="authUsername" autocomplete="username" required>
                    </div>
                    <div class="form-field">
                        <label for="authPassword">密码</label>
                        <input type="password" id="authPassword" autocomplete="current-password" required>
                    </div>
                    <div class="form-field auth-register-only" style="display:none;">
                        <label for="authPlayerId">游戏玩家ID</label>
                        <input type="text" id="authPlayerId" autocomplete="off">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">提交</button>
                    </div>
                    <p id="authMessage" class="auth-message"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="mcwws-auth.js?v=14"></script>
    <script src="mcwws-ledger-page.js?v=1"></script>
    <script>
        (async function () {
            if (window.MCWWS_AUTH?.init) {
                await window.MCWWS_AUTH.init();
            }
            if (!window.MCWWS_AUTH?.getUser?.()) {
                window.MCWWS_AUTH?.openModal?.();
            }
            window.MCWWS_LEDGER_PAGE?.init?.();
        })();
    </script>
</body>
</html>
