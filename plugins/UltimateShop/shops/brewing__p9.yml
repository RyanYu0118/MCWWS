settings:
  menu: example-shop-menu
  buy-more: true
  shop-name: '{lang:brewing-shop-name} (9/9)'
  hide-message: false
  secret-shop-items: false
  allow-favourite: true
  menu-settings:
    layout:
      - 0f00s00x0
      - '000000000'
      - 1ABCDEFG2
      - 1HIJKLMN2
      - 1OPQRSTU2
      - a0403000b
    buttons:
      '4':
        display-item:
          material: ARROW
          name: '{lang:previous-page-button}'
        actions:
          '1':
            type: shop_menu
            shop: brewing__p8
items:
  A:
    price-mode: CLASSIC_ALL
    product-mode: CLASSIC_ALL
    products:
      '1':
        material: SPLASH_POTION_OF_WIND_CHARGING_1
        amount: 1
    buy-prices:
      '1':
        economy-plugin: Vault
        amount: '%mcwws.price_buy_splash_potion_of_wind_charging_1%'
        placeholder: '{amount}$'
        start-apply: 0
    sell-prices:
      '1':
        economy-plugin: Vault
        amount: '%mcwws.price_sell_splash_potion_of_wind_charging_1%'
        placeholder: '{amount}$'
        start-apply: 0
