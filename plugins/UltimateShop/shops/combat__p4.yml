settings:
  menu: example-shop-menu
  buy-more: true
  shop-name: '{lang:combat-shop-name} (4/4)'
  hide-message: false
  secret-shop-items: false
  allow-favourite: true
  menu-settings:
    layout:
      - 0f00s00x0
      - '000000000'
      - 1ABCDEFG2
      - 1HIJKLMN2
      - 1OPQRSTU2
      - a0403000b
    buttons:
      '4':
        display-item:
          material: ARROW
          name: '{lang:previous-page-button}'
        actions:
          '1':
            type: shop_menu
            shop: combat__p3
