settings:
  menu: example-shop-menu
  buy-more: true
  shop-name: '{lang:wools-shop-name} (7/7)'
  hide-message: false
  secret-shop-items: false
  allow-favourite: true
  layout:
    - 0f00s00x0
    - '000000000'
    - 1ABCDEFG2
    - 1HIJKLMN2
    - 1OPQRSTU2
    - aN0030b
items:
  A:
    price-mode: CLASSIC_ALL
    product-mode: CLASSIC_ALL
    products:
      '1':
        material: YELLOW_WOOL
        amount: 1
    buy-prices:
      '1':
        economy-plugin: Vault
        amount: '%mcwws.price_buy_yellow_wool%'
        placeholder: '{amount}$'
        start-apply: 0
    sell-prices:
      '1':
        economy-plugin: Vault
        amount: '%mcwws.price_sell_yellow_wool%'
        placeholder: '{amount}$'
        start-apply: 0
buttons:
  'N':
    display-item:
      material: ARROW
      name: '{lang:previous-page-button}'
    actions:
      '1':
        type: shop_menu
        shop: wools__p6
