settings:
  menu: example-shop-menu
  buy-more: true
  shop-name: '{lang:natural-shop-name} (12/12)'
  hide-message: false
  secret-shop-items: false
  allow-favourite: true
  menu-settings:
    layout:
      - 0f00s00x0
      - '000000000'
      - 1ABCDEFG2
      - 1HIJKLMN2
      - 1OPQRSTU2
      - a0403000b
    buttons:
      '4':
        display-item:
          material: ARROW
          name: '{lang:previous-page-button}'
        actions:
          '1':
            type: shop_menu
            shop: natural__p11
items:
  A:
    price-mode: CLASSIC_ALL
    product-mode: CLASSIC_ALL
    products:
      '1':
        material: SCULK_SENSOR
        amount: 1
    buy-prices:
      '1':
        economy-plugin: Vault
        amount: '%mcwws.price_buy_sculk_sensor%'
        placeholder: '{amount}$'
        start-apply: 0
    sell-prices:
      '1':
        economy-plugin: Vault
        amount: '%mcwws.price_sell_sculk_sensor%'
        placeholder: '{amount}$'
        start-apply: 0
  B:
    price-mode: CLASSIC_ALL
    product-mode: CLASSIC_ALL
    products:
      '1':
        material: COBWEB
        amount: 1
    buy-prices:
      '1':
        economy-plugin: Vault
        amount: '%mcwws.price_buy_cobweb%'
        placeholder: '{amount}$'
        start-apply: 0
    sell-prices:
      '1':
        economy-plugin: Vault
        amount: '%mcwws.price_sell_cobweb%'
        placeholder: '{amount}$'
        start-apply: 0
