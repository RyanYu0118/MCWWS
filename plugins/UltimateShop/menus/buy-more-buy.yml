title: '{lang:buy-more-title}'
size: 54

layout:
  - '000000000'
  - '0abcdefg0'
  - '000000000'
  - '012345670'
  - '0000F0000'
  - 'A0000000C'

amount-items:
  1:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 1
      name: '&a选择数量 &f×1'
      lore:
        - '{lang:buy-more-set-1}'
    set-amount: 1
  2:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 2
      name: '&a选择数量 &f×2'
      lore:
        - '{lang:buy-more-set-2}'
    set-amount: 2
  3:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 4
      name: '&a选择数量 &f×4'
      lore:
        - '{lang:buy-more-set-4}'
    set-amount: 4
  4:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 8
      name: '&a选择数量 &f×8'
      lore:
        - '{lang:buy-more-set-8}'
    set-amount: 8
  5:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 16
      name: '&a选择数量 &f×16'
      lore:
        - '{lang:buy-more-set-16}'
    set-amount: 16
  6:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 32
      name: '&a选择数量 &f×32'
      lore:
        - '{lang:buy-more-set-32}'
    set-amount: 32
  7:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 64
      name: '&a选择数量 &f×64'
      lore:
        - '{lang:buy-more-set-64}'
    set-amount: 64

display-items:
  - a
  - b
  - c
  - d
  - e
  - f
  - g

confirm-items:
  F:
    display-item:
      material: PAPER
      name: '{lang:buy-more-buy-button} x{amount}'
      lore:
        - '{lang:buy-more-buy-button-lore-1}'
        - '{lang:buy-more-buy-button-lore-2}'
    click-action: buy

buttons:
  0:
    display-item:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
  A:
    display-item:
      material: ARROW
      name: '{lang:back-button}'
    actions:
      1:
        type: shop_menu
        shop: '{shop}'
  C:
    display-item:
      material: BARRIER
      name: '{lang:close-button}'
    actions:
      1:
        type: close
