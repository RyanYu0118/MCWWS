title: '{lang:shop-title}'
size: 54

bedrock:
  enabled: true
  content: '{lang:welcome-message}'

open-actions:
  1:
    type: sound
    sound: block.note_block.pling
    open-once: true

layout:
  - '00Y0S0X00'
  - '0ABCDE000'
  - '0FGHI0000'
  - '0JKLM0000'
  - '000000000'
  - '0000Z0000'

buttons:
  0:
    display-item:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
      custom-model-data: 2200002
      hide-tool-tip: true
  Y:
    display-item:
      material: NAME_TAG
      name: '{lang:search-menu-button-name}'
      lore:
        - '{lang:search-menu-button-line-1}'
        - '{lang:search-menu-button-line-2}'
      custom-model-data: 2200005
    actions:
      1:
        type: open_menu
        menu: search
  X:
    display-item:
      material: NAME_TAG
      name: '{lang:favourite-menu-button-name}'
      lore:
        - '{lang:favourite-menu-button-line-1}'
        - '{lang:favourite-menu-button-line-2}'
    actions:
      1:
        type: open_menu
        menu: favourite
  S:
    display-item:
      material: CHEST
      name: '&6商店仓库说明'
      lore:
        - '&7商店目录内的采集物会进入本地仓库'
        - '&7在分类店对商品按丢弃键可取回（单次最多 64）'
    actions:
      1:
        type: sound
        sound: ui.button.click
  A:
    display-item:
      material: BRICKS
      name: '{lang:building-name}'
      lore:
        - '{lang:building-lore-1}'
        - '{lang:building-lore-2}'
    actions:
      1:
        type: shop_menu
        shop: building
  B:
    display-item:
      material: CYAN_WOOL
      name: '{lang:colored-name}'
      lore:
        - '{lang:colored-lore-1}'
        - '{lang:colored-lore-2}'
    actions:
      1:
        type: shop_menu
        shop: colored
  C:
    display-item:
      material: GRASS_BLOCK
      name: '{lang:natural-name}'
      lore:
        - '{lang:natural-lore-1}'
        - '{lang:natural-lore-2}'
    actions:
      1:
        type: shop_menu
        shop: natural
  D:
    display-item:
      material: OAK_SIGN
      name: '{lang:functional-name}'
      lore:
        - '{lang:functional-lore-1}'
        - '{lang:functional-lore-2}'
    actions:
      1:
        type: shop_menu
