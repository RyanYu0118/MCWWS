title: '{lang:buy-more-title}'
size: 54

# Layout symbols are case-insensitive. Do not reuse a/A, c/C, f/F, etc.
layout:
  - 'B1234567X'
  - '000000000'
  - '0000p0000'
  - '0000Y0000'
  - '000000000'
  - '000000000'

amount-items:
  1:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 1
      name: '&a选择数量 &f×1'
      lore:
        - '{lang:buy-more-set-1}'
    set-amount: 1
  2:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 2
      name: '&a选择数量 &f×2'
      lore:
        - '{lang:buy-more-set-2}'
    set-amount: 2
  3:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 4
      name: '&a选择数量 &f×4'
      lore:
        - '{lang:buy-more-set-4}'
    set-amount: 4
  4:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 8
      name: '&a选择数量 &f×8'
      lore:
        - '{lang:buy-more-set-8}'
    set-amount: 8
  5:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 16
      name: '&a选择数量 &f×16'
      lore:
        - '{lang:buy-more-set-16}'
    set-amount: 16
  6:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 32
      name: '&a选择数量 &f×32'
      lore:
        - '{lang:buy-more-set-32}'
    set-amount: 32
  7:
    display-item:
      material: LIME_STAINED_GLASS_PANE
      amount: 64
      name: '&a选择数量 &f×64'
      lore:
        - '{lang:buy-more-set-64}'
    set-amount: 64

display-items:
  - p

confirm-items:
  Y:
    display-item:
      material: PAPER
      name: '{lang:buy-more-sell-button} x{amount}'
      lore:
        - '{lang:buy-more-sell-button-lore-1}'
        - '{lang:buy-more-sell-button-lore-2}'
    click-action: sell

buttons:
  0:
    display-item:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
      custom-model-data: 2200002
      hide-tool-tip: true
  B:
    display-item:
      material: ENCHANTED_BOOK
      name: '{lang:back-button}'
      custom-model-data: 2200003
      glow: false
    actions:
      1:
        type: shop_menu
        shop: '{shop}'
  X:
    display-item:
      material: BARRIER
      name: '{lang:close-button}'
    actions:
      1:
        type: close
