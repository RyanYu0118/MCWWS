title: '{shop-name}'
size: 54

open-actions:
  1:
    type: sound
    sound: item.book.page_turn

layout:
  - '0000000x0'
  - '000000000'
  - '1ABCDEFG2'
  - '1HIJKLMN2'
  - '1OPQRSTU2'
  - 'a0003000b'

buttons:
  0:
    display-item:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
  1:
    display-item:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  a:
    display-item:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  2:
    display-item:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: ' '
  b:
    display-item:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: ' '
  3:
    display-item:
      material: ARROW
      name: '{lang:back-button}'
    actions:
      1:
        type: open_menu
        menu: main
  x:
    display-item:
      material: BARRIER
      name: '{lang:close-button}'
    actions:
      1:
        type: close
