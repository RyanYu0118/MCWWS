name: MCWWS_BuildBridge
main: work.mcwws.buildbridge.McwwsBuildBridgePlugin
version: 1.0.0
api-version: '1.21'
softdepend: [FastAsyncWorldEdit]
description: 本机 HTTP API + Cursor MCP 管理端直写方块与 FAWE 桥接
authors: [RYAN STUDIO]

commands:
  mcwws-buildbridge-reload:
    description: 重载建造桥配置并重启本机 HTTP
    usage: /mcwws-buildbridge-reload
    permission: mcwws.buildbridge.admin

permissions:
  mcwws.buildbridge.admin:
    description: 管理建造桥配置与 HTTP
    default: op
