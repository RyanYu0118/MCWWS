http:
  host: 127.0.0.1
  port: 8765
  # 留空则首次启动自动生成并写回本文件
  token: ""

limits:
  max-fill-volume: 200000
  max-batch-blocks: 50000

# 直写 set_block / fill / set_blocks 的内存历史（与 FAWE //undo 独立）
history:
  enabled: true
  max-entries: 20
  max-blocks-per-entry: 200000

default-world: world

# FAWE 命令代理玩家（可选）。留空则用控制台；控制台选区不稳时可填在线 OP 名
actor-player: ""

schematics-directory: plugins/FastAsyncWorldEdit/schematics
