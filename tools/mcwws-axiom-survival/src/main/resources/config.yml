enabled: true
# 打开后控制台会记录每个编辑包的扣费判定与预估明细，仅排查时用
debug: false
bypass-permission: mcwws.axiom.survival.bypass
prices-file: plugins/Skript/scripts/web/mcwws/economy/web_prices.yml
prices-reload-seconds: 60
reload-prices-before-estimate: true
record-market-stock: true
market-trade-queue: plugins/Skript/scripts/web/data/market_trade_queue.txt
labor:
  place-unit: 0.5
  demolish-multiplier: 2.0

# 拆除回收：拆下来的方块按市场卖价 × rate 折现给玩家，同时按 sell 侧写进市场库存队列。
# rate 1.0 = 完全按市场卖价卖出，和玩家自己挂市场一致；一次编辑的净额 = 材料 + 劳务 − 回收，
# 净额为负时直接把差额打给玩家。
salvage:
  rate: 1.0

# 搬运对冲：同一次编辑里「这里拆掉、那里放下」的同种方块判定为搬运，只收劳务费，
# 既不扣材料费也不给回收款，也不写市场库存队列（不在市场上转一圈）。
# Axiom 会把超大编辑拆成多个包，跨包的搬运只能各包分别对冲。
move-netting:
  enabled: true
max-scan-blocks: 500000
min-balance-to-enable: 0
block-axiom-creative-switch: true

# 撤销退款：Axiom 的撤销是反向再发一次改块包，服务端按「放置/拆除计数互换且格数相同」识别，
# 命中即退款而不是二次扣费；重做会被当成新建造正常扣费。
undo-refund:
  enabled: true
  fee-rate: 0.05
  # 反向编辑与原编辑的最大间隔（秒）
  match-window-seconds: 600
  # 每位玩家保留多少笔待配对记录（大范围编辑会拆成多包）
  history-size: 128
reverse-market-on-undo: true

# 受保护方块（Slimefun 机器、不可破坏方块）：Axiom 异步落地无法逐格拦下，
# 因此记录原状快照，写入后按快照还原；超过 max-restore-blocks 则整包取消。
protection:
  restore-protected-blocks: true
  max-restore-blocks: 4096
  restore-delay-ticks: 5

# 实体生成/删除/调整：不消耗材料，只按只数收劳务费
entity:
  charge-labor: true
  spawn-unit: 20.0
  delete-unit: 5.0
  manipulate-unit: 2.0
  # 生存里默认不显示可拖动小方块，避免误触普通实体。需要时显式授予此权限（OP 也不会默认拥有）。
  gizmo-permission: mcwws.axiom.survival.entity

# 生物群系画笔：不消耗材料，只按涂改格数收劳务费
biome:
  charge-labor: true
  cell-unit: 0.02

# 生存玩家不得通过 Axiom 改动世界时间与世界属性（bypass 权限不受限制）
world-control:
  block-world-time: true
  block-world-property: true

# 额度：0 = 不限。大范围编辑会被 Axiom 拆成多包，因此用每分钟格数限速代替冷却，
# max-charge-per-edit 实际是「单个改块包」的费用上限
limits:
  max-charge-per-edit: 0
  daily-max-charge: 0
  max-blocks-per-minute: 0

# 扣费提示聚合：多少 tick 内的扣费合并成一条；拒绝提示按 key 限流
message-flush-ticks: 20
message-throttle-seconds: 3

# 配合 MCWWS_AxiomSurvivalClient 模组：服务端与客户端均保持生存（保留 HUD）
survival-editor-mode: true
# 进入 Editor 不代玩家开飞行：Axiom 一开菜单就算进入会话，自动开会覆盖玩家自己的飞行选择
enable-flywithfood-on-editor: false
# 既然不代开，退出时也不代关，否则会掐掉玩家自己开的飞行；关菜单本来就按快照还原飞行状态
disable-fly-on-editor-exit: false
# 打开 Editor 菜单期间服务端切旁观（客户端本地本来就是旁观），关菜单时按快照切回；
# 关掉则沿用旧行为：保持生存并强制飞行以规避摔落
spectator-during-menu: true
# 关掉 Editor 菜单或退出时，保留在编辑界面里调过的飞行速度（Axiom 默认可能换回进菜单前的速度）
persist-editor-fly-speed: true
# 无客户端模组时的兜底：Editor 需旁观；退出时恢复进入前位置与模式
restore-editor-on-exit: true
# 进入 Editor 后此 tick 内忽略 vanilla 移动退出检测（防 Shift 进入误触发，20tick≈1秒）
editor-enter-grace-ticks: 60
