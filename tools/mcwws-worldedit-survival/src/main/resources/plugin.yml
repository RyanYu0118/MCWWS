name: MCWWS_WorldEditSurvival
main: work.mcwws.worldedit.McwwsWeSurvivalPlugin
version: 1.0.0
api-version: '1.21'
depend: [FastAsyncWorldEdit, Vault]
softdepend: [Slimefun, Essentials, MCWWS_EconomyLedger]

commands:
  mcwws-we-reload:
    description: 重载创世神生存建造扣费配置
    permission: mcwws.we.survival.admin
    usage: /mcwws-we-reload

permissions:
  mcwws.we.survival.admin:
    default: op
  mcwws.we.survival.bypass:
    description: 跳过创世神生存建造扣费与保护扫描（默认不给任何人，含 OP，需要时用权限插件显式授予）
    default: false
