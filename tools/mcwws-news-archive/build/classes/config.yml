# BookNews 配置相对服务器根目录
booknews-config: plugins/BookNews/config.yml

# 与商店翻页图标一致（ItemsAdder / 资源包 custom model data）
gui:
  title: '&8服务器告示 · 历史 ({page}/{pages})'
  size: 54
  items-per-page: 45
  filler-model: 2200002
  back-model: 2200003
  prev-enabled-model: 2200007
  prev-disabled-model: 2200008
  next-enabled-model: 2200009
  next-disabled-model: 2200010

messages:
  prefix: '&8[&b告示留档&8]&f '
  no-permission: '&c你没有权限查看告示历史。'
  empty: '&e尚无历史告示。编辑 BookNews 并重载后会自动留档。'
  synced-new: '&a已留档新版本：&f{id}'
  synced-same: '&7告示内容未变，无需新建版本。'
  opened: '&7正在打开：&f{title}'
  unknown: '&c找不到该版本：&f{id}'
  reloaded: '&a告示留档已重载。'
